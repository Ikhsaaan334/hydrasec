user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── LAYER 1: SPA frontend ──────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Real-time CLI stream via WebSocket (xterm.js)
    location /ws {
      proxy_pass http://backend-api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # REST API
    location /api/ {
      proxy_pass http://backend-api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # Prometheus metrics API (health-check & telemetri) di subpath
    location /prometheus/ {
      proxy_pass http://prometheus:9090/prometheus/;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    # SPA (frontend-app menyajikan dist + fallback ke index.html)
    location / {
      proxy_pass http://frontend-app:80;
      proxy_set_header Host $host;
    }
  }
}
